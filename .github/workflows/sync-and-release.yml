# One workflow, both branches. Keeps this fork (feuerswut/AntennaPod) in
# lockstep with upstream AntennaPod/AntennaPod and builds a signed release
# APK once main is in sync.
#
# Branch roles:
#   main - the fork's release branch, synced from upstream's "master".
#   dev  - the fork's development branch, synced from upstream's "develop".
#
# Sync model: only CODE is synced, never workflows. For each branch the job
# replaces the working tree with upstream's tree, puts this fork's own
# .github/workflows back, and records the result as ONE new commit on top of
# the branch. Upstream's own commits are never pushed, so no pushed commit
# ever touches .github/workflows and the built-in GITHUB_TOKEN is enough (no
# personal access token needed). `build-release` always builds from main.
name: Sync upstream and build release

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'feuerswut/AntennaPod'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            upstream_branch: master
          - branch: dev
            upstream_branch: develop
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/AntennaPod/AntennaPod.git

      - name: Fetch upstream/${{ matrix.upstream_branch }}
        run: git fetch upstream ${{ matrix.upstream_branch }}

      - name: Sync code from upstream/${{ matrix.upstream_branch }} (workflows excluded)
        run: |
          set -e
          git read-tree --reset -u upstream/${{ matrix.upstream_branch }}
          git rm -rf -q --cached --ignore-unmatch .github/workflows
          rm -rf .github/workflows
          git checkout HEAD -- .github/workflows
          if git diff --cached --quiet; then
            echo "${{ matrix.branch }} already matches upstream/${{ matrix.upstream_branch }} (workflows excluded)."
          else
            git commit -q -m "sync: upstream/${{ matrix.upstream_branch }} @ $(git rev-parse --short upstream/${{ matrix.upstream_branch }})"
            git push origin ${{ matrix.branch }}
          fi

  build-release:
    needs: sync
    if: github.repository == 'feuerswut/AntennaPod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (release branch)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/wrapper-validation@v5

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Read upstream version from app/build.gradle
        id: version
        run: |
          version_name=$(grep -m1 'versionName ' app/build.gradle | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          if [ -z "$version_name" ]; then
            echo "::error::Could not parse versionName from app/build.gradle"
            exit 1
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
          # Upstream's versionName carries a suffix for anything that is not a
          # final release ("3.12.0-beta4", "-rc1"). Flag those as GitHub
          # pre-releases so consumers can tell them apart.
          if printf '%s' "$version_name" | grep -q -- '-'; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=--latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if this version was already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists, nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Secrets are passed through the environment, never interpolated into the
      # shell script or the gradle command line.
      - name: Decode signing keystore
        if: steps.check.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in this repo's Settings -> Secrets and variables -> Actions before this workflow can produce a signed APK. Failing here on purpose rather than shipping an unsigned or fake-signed build."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.keystore"

      - name: Build signed free-flavor release APK
        if: steps.check.outputs.exists == 'false'
        env:
          ORG_GRADLE_PROJECT_releaseStoreFile: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_releaseStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_releaseKeyAlias: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_releaseKeyPassword: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleFreeRelease --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.keystore"

      - name: Rename APK
        if: steps.check.outputs.exists == 'false'
        run: |
          apk=$(find app/build/outputs/apk/free/release -maxdepth 1 -name '*.apk' | head -n1)
          if [ -z "$apk" ]; then
            echo "::error::No APK found under app/build/outputs/apk/free/release/"
            exit 1
          fi
          mv "$apk" "app/build/outputs/apk/free/release/AntennaPod-free-${{ steps.version.outputs.name }}.apk"

      - name: Create GitHub release and upload APK
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            ${{ steps.version.outputs.prerelease }} \
            --title "AntennaPod ${{ steps.version.outputs.name }} (free flavor, auto-built)" \
            --notes "Automated build of upstream AntennaPod ${{ steps.version.outputs.name }}, free/FOSS flavor (no Google Play Services), built and signed by this fork's build-release workflow. See https://github.com/AntennaPod/AntennaPod for the actual upstream project and changelog." \
            "app/build/outputs/apk/free/release/AntennaPod-free-${{ steps.version.outputs.name }}.apk"
